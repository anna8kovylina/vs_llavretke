<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Щенки лавретки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Щенки лавретки</h1>
    <p>Здоровые, дружелюбные, с документами, 2–3 месяца</p>
  </header>

  <main>
    <h2>Наши щенки</h2>

    <div class="cards">
      <div class="card">
        <img src="images/images.jfif" alt="Щенок 1">
        <h3>Немощный</h3>
        <p>Мальчик, 2 месяца</p>
        <p class="price">20 000 ₽</p>
      </div>

      <div class="card">
        <img src="images/images (1).jfif" alt="Щенок 2">
        <h3>Немытая</h3>
        <p>Девочка, 4 месяца</p>
        <p class="price">28 000 ₽</p>
      </div>

    </div>
  </main>

  <section class="order">
    <h2>Оставить заявку</h2>
    <form id="orderForm">
      <input type="text" id="name" placeholder="Ваше имя" required>
      <input type="tel" id="phone" placeholder="Телефон" required>
      <select id="puppy">
        <option>Немощный</option>
        <option>Немытая</option>
      </select>
      <button type="submit">Отправить</button>
    </form>
    <p id="result"></p>
  </section>

  <footer>
    <p> +7 (222) 222-22-22 | Москва</p>
    <p> Питомник «Лавретка»</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
